[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osvaldo-downloader-pro"
version = "0.1.0"
description = "Aplicación de escritorio para la descarga y organización multimedia de múltiples plataformas."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "osvaldoDownloaderPro Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]
