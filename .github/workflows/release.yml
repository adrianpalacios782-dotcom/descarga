# ============================================================
# Release de osvaldoDownloaderPro
#
# Publica el instalador en GitHub Releases SIEMPRE con los dos assets
# obligatorios que exige el actualizador de la app instalada:
#   - osvaldoDownloaderPro-<version>-Setup.exe
#   - SHA256SUMS.txt
# y ademas un artefacto portable empaquetado en ZIP:
#   - osvaldoDownloaderPro-<version>-portable.zip
#
# La release v1.5.3 quedo VACIA porque no habia workflow y el build se
# publico a mano. Este workflow cierra ese hueco:
#
#   1. job "quality"  -> ruff + mypy + pytest (mismo gate que CI.yml).
#                         Si falla, NO se compila ni se publica nada.
#   2. job "build"    -> PyInstaller + Inno Setup en windows-latest.
#                         Empaqueta el salida de PyInstaller en un .zip
#                         portable. GATE ESTRICTO: cada asset debe existir Y
#                         pesar al menos 1 MB; si no, el job falla y no se
#                         publica nada.
#   3. job "publish"  -> sube el Setup.exe y el SHA256SUMS.txt con
#                         scripts\publish_release.ps1 (que ya tiene sus propios
#                         gates, incluido el de coherencia del checksum) y el
#                         .zip portable con softprops/action-gh-release.
#                         Despues VERIFICA via API que los tres assets
#                         quedaron disponibles.
#
# Uso:
#   git tag v1.5.4 && git push origin v1.5.4     -> dispara el workflow
#   workflow_dispatch (input: version)           -> publicacion manual
#
# NOTA: el instalador sale SIN FIRMA mientras no exista
# scripts\signing.config.json (Smart App Control puede bloquearlo).
# Ver docs\SIGNING.md para configurar el certificado.
# ============================================================
name: Release

on:
  push:
    tags:
      # Solo tags de version semantica completa (v1.5.4). Un tag "v"
      # suelto o "v1" NO dispara nada: se evita publicar un binario con
      # version incoherente con src\__init__.py.
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar (ej. 1.5.4). Se ignora si se dispara por tag."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint + tipos + tests (gate)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Node (runtime JS para yt-dlp / solver EJS)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Mypy (strict)
        run: python -m mypy --strict

      - name: Pytest
        run: python -m pytest -q --durations=10 --basetemp=scratch/pytest_tmp

      # Este job es INTENCIONALMENTE identico al de ci.yml: si divergieran,
      # un release podria pasar el gate de calidad y fallar en CI (o al reves).
      - name: Version coherente (src/__init__.py == scripts/version_info.txt)
        shell: pwsh
        run: |
          $srcVersion = (Select-String -Path src\__init__.py -Pattern '__version__\s*=\s*"(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
          $quad = "$srcVersion.0"
          $vi = Get-Content scripts\version_info.txt -Raw
          if ($vi -notmatch [regex]::Escape("StringStruct('FileVersion', '$quad')")) {
            Write-Error "version_info.txt desincronizado con src/__init__.py ($srcVersion)"
            exit 1
          }
          Write-Host "Version coherente: $srcVersion"

  build:
    name: Compilar instalador
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Node (runtime JS para yt-dlp / solver EJS)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar dependencias de build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # bin\ffmpeg.exe y bin\ffprobe.exe estan en .gitignore (son binarios de
      # terceros de ~100 MB). En CI se descargan; en local se conservan.
      - name: Descargar FFmpeg/FFprobe
        shell: pwsh
        run: |
          $url = $env:FFMPEG_URL
          if (-not $url) {
            $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          }
          Write-Host "Descargando FFmpeg desde: $url"
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          curl.exe -sSL --retry 3 --retry-delay 5 -o $zip $url
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al descargar FFmpeg"; exit 1 }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "ffmpeg") -Force
          $root = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "ffmpeg") -Directory | Select-Object -First 1
          foreach ($b in @("ffmpeg.exe", "ffprobe.exe")) {
            $src = Get-ChildItem -Path $root.FullName -Filter $b -Recurse -File | Select-Object -First 1
            if (-not $src) { Write-Error "No se encontro $b en el zip de FFmpeg"; exit 1 }
            Copy-Item -LiteralPath $src.FullName -Destination (Join-Path "bin" $b) -Force
          }
          & .\bin\ffmpeg.exe -version | Select-Object -First 1

      - name: Detectar Inno Setup 6
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $found) {
            Write-Host "Inno Setup no encontrado; instalando con chocolatey..."
            choco install innosetup --yes --no-progress --limit-output
            $found = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $found) { Write-Error "ISCC.exe no disponible"; exit 1 }
          Write-Host "Inno Setup: $found"
          "ISCC=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Version a publicar (gate vs src/__init__.py)
        id: version
        shell: pwsh
        run: |
          $srcVersion = (Select-String -Path src\__init__.py -Pattern '__version__\s*=\s*"(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
          $tagVersion = ""
          if ($env:GITHUB_REF -like "refs/tags/v*") { $tagVersion = $env:GITHUB_REF -replace "^refs/tags/v", "" }
          $inputVersion = "${{ inputs.version }}"
          $target = $tagVersion
          if (-not $target) { $target = $inputVersion }
          if (-not $target) { Write-Error "No se pudo determinar la version a publicar"; exit 1 }
          if ($target -ne $srcVersion) {
            Write-Error "La version del tag/parametro ($target) no coincide con src/__init__.py ($srcVersion)"
            exit 1
          }
          Write-Host "Version a publicar: $target"
          "RELEASE_VERSION=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "release_version=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build (tests -> PyInstaller -> Inno Setup)
        shell: pwsh
        run: |
          # -SkipSigning: en CI no hay certificado Authenticode.
          # El instalador sale como BETA NO FIRMADO (ver docs/SIGNING.md).
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_release.ps1 -SkipSigning

      # Empaquetado del artefacto portable: se comprime la carpeta que produce
      # PyInstaller (dist\osvaldoDownloaderPro: el .exe + _internal + bin).
      # Se usa shutil.make_archive de la stdlib porque Python esta SIEMPRE
      # disponible en el runner y tolera rutas largas mejor que Compress-Archive.
      - name: Empaquetar ZIP portable (salida de PyInstaller)
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $root = (Get-Location).Path
          $appDir = Join-Path $root "dist\osvaldoDownloaderPro"
          if (-not (Test-Path -LiteralPath (Join-Path $appDir "osvaldoDownloaderPro.exe"))) {
            Write-Error "No se encontro la salida de PyInstaller en $appDir"
            exit 1
          }
          # Rutas ABSOLUTAS a proposito: make_archive() hace chdir() a root_dir
          # y resolver el nombre del zip de forma relativa al cwd tras el chdir
          # es sutil. Con absolutas el resultado no depende de esa semantica.
          $base  = Join-Path $root "dist\osvaldoDownloaderPro-$version-portable"
          $dist  = Join-Path $root "dist"
          python -c "import shutil,sys; sys.exit(0 if shutil.make_archive(sys.argv[1], 'zip', root_dir=sys.argv[2], base_dir='osvaldoDownloaderPro') else 1)" $base $dist
          if ($LASTEXITCODE -ne 0) { Write-Error "Fallo al empaquetar el ZIP portable"; exit 1 }
          $zip = "$base.zip"
          if (-not (Test-Path -LiteralPath $zip)) { Write-Error "No se genero el ZIP portable: $zip"; exit 1 }
          Write-Host ("ZIP portable OK: {0} ({1} MB)" -f $zip, [math]::Round((Get-Item -LiteralPath $zip).Length / 1MB, 1))

      # GATE ESTRICTO: si falta cualquiera de los assets o alguno pesa menos de
      # 1 MB, el job falla y la publicacion no llega a ejecutarse. Esto es
      # exactamente lo que falto en la v1.5.3 (release publicada sin assets) y
      # lo que evita publicar un binario truncado o vacio.
      - name: GATE - Assets obligatorios (existen y los binarios pesan >= 1 MB)
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $minBytes = 1MB
          $assets = @(
            @{ Path = "installer\osvaldoDownloaderPro-$version-Setup.exe"; Label = "instalador"; Min = $minBytes },
            @{ Path = "dist\osvaldoDownloaderPro-$version-portable.zip";  Label = "zip portable"; Min = $minBytes },
            # El archivo de hashes es texto: solo se exige que exista.
            @{ Path = "dist\SHA256SUMS.txt";                            Label = "hashes";      Min = 0 }
          )
          $fail = $false
          foreach ($a in $assets) {
            if (-not (Test-Path -LiteralPath $a.Path)) {
              Write-Error "Falta el asset ($($a.Label)): $($a.Path)"
              $fail = $true
              continue
            }
            $len = (Get-Item -LiteralPath $a.Path).Length
            $mb = [math]::Round($len / 1MB, 1)
            if ($len -lt $a.Min) {
              Write-Error "Asset por debajo del minimo de 1 MB ($($a.Label)): $($a.Path) = $len bytes"
              $fail = $true
              continue
            }
            Write-Host ("  OK  {0,-12} {1} ({2} MB)" -f $a.Label, $a.Path, $mb)
          }
          if ($fail) { exit 1 }

      - name: Reporte de release
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "build\release\RELEASE_REPORT.md") {
            Get-Content -LiteralPath "build\release\RELEASE_REPORT.md"
          }

      - name: Subir artefactos (artefacto de la release)
        uses: actions/upload-artifact@v7
        with:
          # Nombre unico por run: si dos runs del mismo tag se solapan, el
          # segundo no pisa el artefacto del primero y el job 'publish' no
          # puede subir un binario de otro run.
          name: osvaldoDownloaderPro-release-${{ github.run_id }}
          path: |
            installer/osvaldoDownloaderPro-*-Setup.exe
            dist/SHA256SUMS.txt
            dist/osvaldoDownloaderPro-*-portable.zip
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Descargar artefactos
        uses: actions/download-artifact@v8
        with:
          name: osvaldoDownloaderPro-release-${{ github.run_id }}
          path: .

      - name: Publicar (gates + subida + verificacion)
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\publish_release.ps1 `
            -Version $version `
            -Repo "${{ github.repository }}"

      # Publicacion del artefacto portable con softprops/action-gh-release.
      # Se ejecuta DESPUES de publish_release.ps1, que ya creo la release (y el
      # tag) con sus notas y sus assets obligatorios. La accion reutiliza esa
      # release en vez de crear otra: no se pasan `body` ni
      # `generate_release_notes` para no pisar las notas ya escritas.
      # `fail_on_unmatched_files` convierte un glob que no coincide en un fallo
      # del job en vez de publicar una release sin el ZIP.
      - name: Publicar ZIP portable (softprops/action-gh-release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: osvaldoDownloaderPro ${{ env.RELEASE_VERSION }}
          files: |
            dist/osvaldoDownloaderPro-${{ env.RELEASE_VERSION }}-portable.zip
          fail_on_unmatched_files: true
          preserve_order: true
          overwrite_files: true

      # Verificacion final e independiente del script: la release debe tener
      # los 3 assets y el ZIP debe pesar al menos 1 MB.
      - name: Verificar assets publicados
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $minBytes = 1MB
          $expected = @(
            @{ Name = "osvaldoDownloaderPro-$version-Setup.exe"; Min = $minBytes },
            @{ Name = "SHA256SUMS.txt";                           Min = 0 },
            @{ Name = "osvaldoDownloaderPro-$version-portable.zip"; Min = $minBytes }
          )
          $json = gh release view $tag --repo "${{ github.repository }}" --json assets,tagName,url | ConvertFrom-Json
          $names = @($json.assets | ForEach-Object { $_.name })
          Write-Host "Release $($json.tagName) -> $($json.url)"
          $missing = @()
          foreach ($e in $expected) {
            $asset = @($json.assets | Where-Object { $_.name -eq $e.Name })
            if ($asset.Count -eq 0) {
              $missing += $e.Name
              continue
            }
            if ($asset[0].size -lt $e.Min) {
              Write-Error "Asset publicado por debajo del minimo: $($e.Name) = $($asset[0].size) bytes"
              exit 1
            }
            Write-Host ("  OK  {0}  ({1} MB)" -f $e.Name, [math]::Round($asset[0].size / 1MB, 1))
          }
          if ($missing.Count -gt 0) {
            Write-Error "Assets ausentes en la release publicada: $($missing -join ', ')"
            exit 1
          }
          foreach ($a in $json.assets) {
            Write-Host ("  {0}  ({1} MB)" -f $a.name, [math]::Round($a.size / 1MB, 1))
          }
